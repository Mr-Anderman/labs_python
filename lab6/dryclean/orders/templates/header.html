{% load static %}
<div class="header">
    <img src="{% static 'img/logo.png' %}" alt="Химчистка «Бриллиант»">
    <div class="auth-links">
        {% if all_link %}<a href="{% url 'archive' %}">Все договоры</a>{% endif %}
        {% if user.is_authenticated %}
            <a href="{% url 'create_contract' %}">Принять вещь</a>
            <a href="{% url 'logout' %}">Выход ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>
</div>
