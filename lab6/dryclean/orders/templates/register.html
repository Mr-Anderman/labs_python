{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Химчистка «Бриллиант» — регистрация</title>
    <link rel="stylesheet" href="{% static 'css/orders.css' %}">
</head>
<body class="article">
    {% include 'header.html' with all_link=True %}
    <div class="content narrow">
        <h1>Регистрация сотрудника</h1>
        <form method="POST" class="contract-form">{% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ form.username }}">
            <input type="email" name="email" placeholder="Email" value="{{ form.email }}">
            <input type="password" name="password" placeholder="Пароль">
            <input type="password" name="password2" placeholder="Повторите пароль">
            <input type="submit" value="Зарегистрироваться">
        </form>
        <p class="errors">{{ form.errors }}</p>
    </div>
</body>
</html>
