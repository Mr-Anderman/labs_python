{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Архив договоров</title>
    <link rel="stylesheet" href="{% static 'css/orders.css' %}">
</head>
<body class="archive">
    {% include 'header.html' %}
    <div class="archive">
        {% for contract in contracts %}
        <div class="one-post">
            <h2 class="post-title">
                <a href="{% url 'get_contract' contract_id=contract.id %}">Договор №{{ contract.number }} — {{ contract.client }}</a>
            </h2>
            <div class="article-info">
                <div class="article-author">Приёмщик: {{ contract.receiver.username }},
                    филиал: <a href="{% url 'branch_stats' branch_id=contract.branch.id %}">{{ contract.branch }}</a></div>
                <div class="article-created-date">{{ contract.date_received }}</div>
            </div>
            <p class="article-text">{{ contract.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
