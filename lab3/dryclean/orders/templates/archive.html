{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Архив договоров</title>
<link rel="stylesheet" href="{{ STATIC_URL }}/static/index.css">
</head>
<body>
    <div class="header">
        <img src="{% static 'img/logo.png' %}" alt="Химчистка «Чистюля»">
    </div>
    <div class="archive">
        {% for contract in contracts %}
        <div class="one-post">
            <h2 class="post-title">Договор №{{ contract.number }} — {{ contract.client }}</h2>
            <div class="article-info">
                <div class="article-author">Приёмщик: {{ contract.receiver.username }}, филиал: {{ contract.branch }}</div>
                <div class="article-created-date">{{ contract.date_received }}</div>
            </div>
            <p class="article-text">{{ contract.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
